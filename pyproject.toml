[project]
name = "imdb-helper"
version = "0.1.0"
description = "CLI tool for quick IMDb movie lookups"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "simple-term-menu>=1.6.0",
]

[project.scripts]
imdb = "imdb_helper.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
